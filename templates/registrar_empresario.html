<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modulo Empresario</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/registrar.css') }}">
</head>

<body>

<div class="container mt-4">


  <div class="pagetitle">
    <h1>Registro Empresario</h1>
    <nav>
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/panel">Inicio</a></li>
        <li class="breadcrumb-item active">Datos Empresario</li>
      </ol>
    </nav>
  </div>

  <div class="card p-4">

    <h5 class="card-title">
      <i class="bi bi-building me-2"></i> Datos del Empresario
    </h5>

    <p class="text-muted">
      Por favor ingrese la información básica del empresario o representante legal.
    </p>

    <form action="/guardar_empresario" method="POST">

      <div class="row">

        <div class="col-md-6 mb-3">
          <label>Nombres completos</label>
          <input type="text" name="nombres" class="form-control" placeholder="Ej: Juan Carlos" required>
        </div>

        <div class="col-md-6 mb-3">
          <label>Apellidos</label>
          <input type="text" name="apellidos" class="form-control" placeholder="Ej: Pérez Gómez" required>
        </div>

        <div class="col-md-6 mb-3">
          <label>Correo electrónico</label>
          <input type="email" name="correo" class="form-control" placeholder="correo@ejemplo.com" required>
        </div>

        <div class="col-md-6 mb-3">
          <label>Tipo de persona</label>
          <select name="tipo" class="form-control" required>
            <option value="">Seleccione...</option>
            {% for tipo in tipos %}
              <option value="{{tipo}}">{{tipo}}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label>Rol</label>
          <select name="rol" class="form-control" required>
            <option value="">Seleccione...</option>
            {% for rol in roles %}
              <option value="{{rol}}">{{rol}}</option>
            {% endfor %}
          </select>
        </div>

      </div>

      <div class="text-end">
        <button type="submit" class="btn btn-sena">Siguiente Paso</button>
      </div>

    </form>

  </div>

</div>

</body>
</html>
