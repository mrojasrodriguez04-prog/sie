
<!doctype html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Consulta Ventas</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/consultaventa.css') }}">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

</head>

<body>


<div class="page-header">

<h1 class="page-title">

Módulo Consultas

</h1>

<div class="breadcrumb">

Inicio / Análisis de Ventas

</div>

</div>

<div class="container">

<div class="analysis-title">

<i class="bi bi-graph-up"></i>

<span>
Análisis de Ventas
</span>

</div>

<p class="description">

Seleccione los filtros para comparar
ventas históricas de productos o
servicios entre empresas.

</p>

<form method="POST">

<div class="form-row">

<div class="form-group">

<label>
Sector Económico
</label>

<select
id="sector">

<option value="">
Seleccione
</option>

{% for s in sectores %}

<option value="{{ s.id_sector }}">

{{ s.nombre_sector }}

</option>

{% endfor %}

</select>

</div>

<div class="form-group">

<label>
Subsector
</label>

<select
id="subsector">

<option value="">
Seleccione
</option>

</select>

</div>

</div>

<div class="form-row">

<div class="form-group">

<label>
Categoría
</label>

<select
id="categoria"
name="categoria">

<option value="">
Seleccione
</option>

</select>

</div>

<div class="form-group">

<label>
Producto
</label>

<select
id="producto"
name="producto">

<option value="">
Seleccione
</option>

</select>

</div>

</div>

<div class="form-row">

<div class="form-group">

<label>
Fecha inicio
</label>

<input
type="date"
name="fecha_inicio"
required>

</div>

<div class="form-group">

<label>
Fecha fin
</label>

<input
type="date"
name="fecha_fin"
required>

</div>

</div>

<div class="buttons">

<button
type="submit"
formaction="/consulta/resultados"
class="btn-consultar">

Generar Análisis


</button>

</div>

</form>

</div>


<script>

const sector =
document.getElementById("sector");

const subsector =
document.getElementById("subsector");

const categoria =
document.getElementById("categoria");

const producto =
document.getElementById("producto");



sector.addEventListener(
"change",
async ()=>{

const response =
await fetch(
`/get_subsectores/${sector.value}`
);

const data =
await response.json();

subsector.innerHTML =
'<option value="">Seleccione</option>';

categoria.innerHTML =
'<option value="">Seleccione</option>';

producto.innerHTML =
'<option value="">Seleccione</option>';

data.forEach(s=>{

subsector.innerHTML +=

`<option value="${s.id}">
${s.nombre}
</option>`;

});

});



subsector.addEventListener(
"change",
async ()=>{

const response =
await fetch(
`/get_categorias/${subsector.value}`
);

const data =
await response.json();

categoria.innerHTML =
'<option value="">Seleccione</option>';

producto.innerHTML =
'<option value="">Seleccione</option>';

data.forEach(c=>{

categoria.innerHTML +=

`<option value="${c.id}">
${c.nombre}
</option>`;

});

});



categoria.addEventListener(
"change",
async ()=>{

const response =
await fetch(
`/get_productos/${categoria.value}`
);

const data =
await response.json();

producto.innerHTML =
'<option value="">Seleccione</option>';

data.forEach(p=>{

producto.innerHTML +=

`<option value="${p}">
${p}
</option>`;

});

});

</script>

</body>

</html>
