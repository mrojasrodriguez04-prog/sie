
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Análisis Comparativo
</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/resultado_consulta.css') }}">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="top-bar">

<a href="/consulta/ventas"
class="btn-volver">

Volver

</a>

</div>

<h1>

Análisis Comparativo de Ventas

</h1>

<h2>

{{ producto }}

</h2>

<table>

<thead>

<tr>

<th>Fecha</th>

<th>Empresa</th>

<th>Unidades Vendidas</th>

<th>Valor Ventas</th>

</tr>

</thead>

<tbody>

{% for r in resumen %}

<tr>

<td>

{{ r.fecha }}

</td>

<td>

<div class="empresa-info">

<span
class="punto-color"
style="background: {{ r.color }}">
</span>

{{ r.empresa }}

</div>

</td>

<td>

{{ r.unidades }}

</td>

<td>

${{ "{:,.0f}".format(r.valor) }}

</td>

</tr>

{% endfor %}

</tbody>

</table>

<div class="graficas">

<div class="grafica-box">

<h3>

Unidades Vendidas

</h3>

<canvas
id="graficaUnidades">
</canvas>

</div>

<div class="grafica-box">

<h3>

Valor Ventas

</h3>

<canvas
id="graficaValor">
</canvas>

</div>

</div>

<script>

const ctx1 =
document.getElementById(
"graficaUnidades"
);

new Chart(ctx1, {

    type: "line",

    data: {

        datasets: {{ datasets_unidades|tojson }}

    },

    options: {

        responsive: true,

        interaction: {

            mode: "point",

            intersect: true

        },

    
        plugins: {
           
            
            legend: {

                position: "bottom"

            },
        tooltip: {

    callbacks: {

        title: function(context){

            const x = context[0].parsed.x;

            return x <= 50
                ? "{{ labels[0] }}"
                : "{{ labels[1] }}";

        },

        label: function(context){

            return context.dataset.label +
                   ": " +
                   context.parsed.y.toLocaleString('es-CO');

        }

    }

}

},
        

 
        scales: {

            x: {

                type: "linear",

                min: 0,

                max: 100,

                ticks: {

                    callback: function(value) {

                        if(value == 0)
                            return "{{ labels[0] }}";

                        if(value == 100)
                            return "{{ labels[1] }}";

                        return "";

                    }

                }

            },

            y: {

                beginAtZero: true,

                title: {

                    display: true,

                    text: "Unidades Vendidas"

                }

            }

        }

    }

});



const ctx2 =
document.getElementById(
"graficaValor"
);

new Chart(ctx2, {

    type: "line",

    data: {

        datasets: {{ datasets_valor|tojson }}

    },

    options: {

        responsive: true,

        interaction: {

            mode: "nearest",

            intersect: true

        },

        plugins: {

            legend: {

                position: "bottom"

            },
           tooltip: {

    callbacks: {

        title: function(context){

            const x = context[0].parsed.x;

            return x <= 50
                ? "{{ labels[0] }}"
                : "{{ labels[1] }}";

        },

        label: function(context){

            return context.dataset.label +
                   ": " +
                   context.parsed.y.toLocaleString('es-CO');

        }

    }

}

        },

        scales: {

            x: {

                type: "linear",

                min: 0,

                max: 100,

                ticks: {

                    callback: function(value) {

                        if(value == 0)
                            return "{{ labels[0] }}";

                        if(value == 100)
                            return "{{ labels[1] }}";

                        return "";

                    }

                }

            },

            y: {

                beginAtZero: true,

                title: {

                    display: true,

                    text: "Valor Ventas"

                }

            }

        }

    }

});

</script>

</body>

</html>
