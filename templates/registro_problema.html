<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redes Sociales</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/registroProblema.css') }}"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-+qdLaB5m0v1k1eE3fR2eT5t1A4J0t9jWbi7r1ikT9VgW8ZfFfJp8eFZk8GZP2F6R"
      crossorigin="anonymous"
    />
  </head>
  <body>
    {% with mensajes = get_flashed_messages() %} {% if mensajes %} {% for
    mensaje in mensajes %}
    <div
      style="
        background: #7a93d8;
        color: #000000;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 15px;
        font-weight: bold;
      "
    >
      {{ mensaje }}
    </div>
    {% endfor %} {% endif %} {% endwith %}
   
    </div>
        <div class="top-bar">
  <a href="/proceso/{{ proceso.id_proceso }}/problemas" class="btn-volver">
    Volver
  </a>
</div>


<div class="form-container">
<h2>Nuevo problema</h2>

<h3 class="breadcrumb">
  <a href="/empresario/{{ empresa.id_empresario }}/empresas">
    {{ empresa.nombre_empresa }}
  </a>
  >
  <a href="/empresa/{{ empresa.id_empresa }}/procesos">
    {{ proceso.subproceso_area }}
  </a>
</h3>

  <form action="/guardar_problema/{{ proceso.id_proceso }}" method="POST">

    <div class="input-group">
      <label>Descripción</label>
       <input type="text" name="descripcion" placeholder="Descripción" required>
    </div>

    <button type="submit">Guardar</button>

  </form>
</div>

</body>
</html>
