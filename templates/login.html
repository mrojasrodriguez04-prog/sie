<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inicio</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/login.css') }}"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  </head>

<body>
    <div class="mensaje-container">
      {% with mensajes = get_flashed_messages() %} {% if mensajes %} {% for
      mensaje in mensajes %}
      <div class="mensaje">{{ mensaje }}</div>
      {% endfor %} {% endif %} {% endwith %}
    </div>

<div class="login-container">

  <h3 class="titulo">
    <i class="bi bi-person-circle"></i> Inicio de Sesión
  </h3>

  <p>Ingrese sus credenciales para acceder a SIE.</p>

  <form action="/validar_login" method="POST">
    
    <div class="input-group">
      <label>Usuario o Número de Identificación</label>
      <input type="text" name="email" placeholder="Ingrese su usuario" required />
    </div>

    <div class="input-group">
      <label>Contraseña</label>

      <div class="password-container">
        <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required />
        <span class="toggle-password">
          <i class="bi bi-eye"></i>
        </span>
      </div>
    </div>


    <button type="submit">
      <i class="bi bi-box-arrow-in-right"></i> Ingresar
    </button>
    
  </form>
</div>

</body>
</html>
